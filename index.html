<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para você</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }
        #terminal {
            white-space: pre;
            font-size: min(2.4vw, 11px);
            line-height: 1.05;
            text-align: center;
        }
        #text-container {
            margin-top: 8px;
            text-align: center;
            max-width: 95vw;
        }
        #main-msg {
            font-size: clamp(14px, 4.2vw, 18px);
            font-weight: bold;
            color: #ffe600;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        #sub-msg {
            font-size: clamp(11px, 3.2vw, 13px);
            color: #666;
            line-height: 1.3;
        }
    </style>
</head>
<body>
    <div id="terminal">Carregando...</div>
    
    <div id="text-container">
        <div id="main-msg">feliz 3 meses! te amo gatinha</div>
        <div id="sub-msg">ansiosa pra dividir o resto<br>da vida inteira com você!</div>
    </div>

    <script>
        const FPS = 24;
        const SPIN_SPEED = 0.6;
        const TILT = 0.30;
        const CAM_DIST = 4.0;
        const NUM_HEARTS = 18;

        const BLUE_DARK = [17, 18, 19, 20, 21, 27];
        const BLUE_MID = [25, 26, 31, 32, 33, 39];
        const BLUE_LIGHT = [38, 44, 45, 51, 75, 117];
        const CYAN_BRIGHT = [116, 123, 159, 195, 231];
        const GOLD_CENTER = [94, 136, 178, 214, 220];
        const DARK_CENTER = [52, 58, 94, 130, 136];
        const GREENS = [22, 28, 28, 34, 35, 71, 77, 114];
        const PAPER = [101, 144, 187, 223, 230, 231];
        const RIBBON = [88, 125, 161, 197, 204, 211];
        const HEART_COLORS = [116, 123, 159, 195, 220, 226];
        const MSG_HEX_COLORS = ['#ffd700', '#ffe600', '#fff033', '#fff780', '#ffffff', '#fff780', '#fff033', '#ffe600'];

        const SHADE = ".:-=+*%@";
        const PETAL_SHADE = "+*#%";
        const PIVOT_Y = 0.2;

        const _L_x = -0.45, _L_y = 0.6, _L_z = 0.66;
        const _n = Math.sqrt(_L_x*_L_x + _L_y*_L_y + _L_z*_L_z);
        const LX = _L_x / _n, LY = _L_y / _n, LZ = _L_z / _n;

        const DISC_TYPES = [
            [BLUE_LIGHT, GOLD_CENTER, 13],
            [BLUE_MID, GOLD_CENTER, 8],
            [CYAN_BRIGHT, DARK_CENTER, 6],
            [BLUE_DARK, GOLD_CENTER, 7],
            [BLUE_LIGHT, DARK_CENTER, 12],
            [BLUE_MID, DARK_CENTER, 9],
        ];
        const TULIP_COLORS = [BLUE_LIGHT, BLUE_MID, CYAN_BRIGHT];

        function norm(v) {
            let m = Math.sqrt(v[0]*v[0] + v[1]*v[1] + v[2]*v[2]) || 1.0;
            return [v[0]/m, v[1]/m, v[2]/m];
        }
        function cross(a, b) {
            return [
                a[1]*b[2] - a[2]*b[1],
                a[2]*b[0] - a[0]*b[2],
                a[0]*b[1] - a[1]*b[0]
            ];
        }
        function add(p, d, k) {
            return [p[0]+d[0]*k, p[1]+d[1]*k, p[2]+d[2]*k];
        }

        let seedVal = 21;
        function rnd() {
            let x = Math.sin(seedVal++) * 10000;
            return x - Math.floor(x);
        }

        function build_scene() {
            let pts = [];
            let neck = [0.0, -0.12, 0.0];
            let C = [0.0, 0.12, 0.0], D = 0.64;
            let N = 10;
            let golden = Math.PI * (3 - Math.sqrt(5));
            let heads = [];
            
            for (let i = 0; i < N; i++) {
                let el = (88 - 60 * Math.sqrt(i / (N - 1))) * Math.PI / 180;
                let az = i * golden;
                let d = [Math.cos(el)*Math.cos(az), Math.sin(el), Math.cos(el)*Math.sin(az)];
                let pos = add(C, d, D * (0.92 + rnd() * 0.13));
                heads.push([pos, norm(d)]);
            }

            let tulip_slots = new Set([3, 8]);
            let flowers = [];
            let disc_i = 0;
            
            heads.forEach(([pos, axis], idx) => {
                let base = add(pos, axis, -0.03);
                for (let j = 0; j < 70; j++) {
                    let t = j / 69;
                    let p = [
                        base[0] + (neck[0]-base[0])*t,
                        base[1] + (neck[1]-base[1])*t,
                        base[2] + (neck[2]-base[2])*t
                    ];
                    pts.push([p[0], p[1], p[2], axis[0], 0.0, axis[2], GREENS, -0.15, true, null]);
                }
                if (tulip_slots.has(idx)) {
                    let n_t = Array.from(tulip_slots).filter(k => k < idx).length;
                    flowers.push([pos, "tulip", TULIP_COLORS[n_t % TULIP_COLORS.length], null, 0, 0.11, rnd() * 6.28]);
                } else {
                    let [petals, center, n_pet] = DISC_TYPES[disc_i % DISC_TYPES.length];
                    disc_i++;
                    flowers.push([pos, "disc", petals, center, n_pet, 0.12 + rnd()*0.02, rnd() * 6.28]);
                }
            });

            for (let i = 0; i < 8; i++) {
                let a = (i + 0.4) / 8 * 2 * Math.PI;
                let c = Math.cos(a), s = Math.sin(a);
                let base = [0.26 * c, 0.30, 0.26 * s];
                let d = norm([c, 0.15, s]);
                let side = [-s, 0.0, c];
                let n = norm(cross(side, d));
                let L = 0.30, W = 0.07;
                for (let ti = 0; ti < 32; ti++) {
                    let t = ti / 31;
                    for (let wi = -5; wi <= 5; wi++) {
                        let w = wi / 5;
                        let curl = 0.025 * w * w;
                        let p = [
                            base[0] + d[0]*L*t + side[0]*W*Math.sin(Math.PI*t)*w + n[0]*curl,
                            base[1] + d[1]*L*t - 0.10*t*t + n[1]*curl,
                            base[2] + d[2]*L*t + side[2]*W*Math.sin(Math.PI*t)*w + n[2]*curl
                        ];
                        let rib = (wi === 0) ? -0.25 : 0.0;
                        pts.push([p[0], p[1], p[2], n[0], n[1], n[2], GREENS, rib, true, null]);
                    }
                }
            }

            let y0 = -0.20, y1 = 0.30, r0 = 0.06, r1 = 0.36;
            let k_val = (r1 - r0) / (y1 - y0);
            let rings = 50;
            for (let i = 0; i < rings; i++) {
                let t = i / (rings - 1);
                let r = r0 + (r1 - r0) * t;
                let count = Math.max(8, Math.floor(170 * r));
                for (let j = 0; j < count; j++) {
                    let ph = (j + rnd()) / count * 2 * Math.PI;
                    let c = Math.cos(ph), s = Math.sin(ph);
                    let y = y0 + (y1 - y0) * t;
                    if (t > 0.9) y += 0.03 * Math.sin(9 * ph);
                    let fold = 0.3 * (Math.abs(Math.sin(5 * ph)) - 0.6);
                    let nn = norm([c, -k_val, s]);
                    pts.push([r*c, y, r*s, nn[0], nn[1], nn[2], PAPER, fold, false, null]);
                }
            }

            let babies = [];
            for (let i = 0; i < 90; i++) {
                let a = rnd() * 2 * Math.PI;
                let el = 0.3 + rnd() * 1.1;
                let rr = 0.40 + rnd() * 0.18;
                babies.push([rr * Math.cos(a) * Math.cos(el), C[1] + rr * Math.sin(el), rr * Math.sin(a) * Math.cos(el), rnd() * 6.28]);
            }

            let sparkles = [];
            for (let i = 0; i < 30; i++) {
                let a = rnd() * 2 * Math.PI;
                let rr = 0.75 + rnd() * 0.20;
                sparkles.push([rr * Math.cos(a), -0.3 + rnd()*1.3, rr * Math.sin(a), rnd() * 6.28, 1.5 + rnd()*2.5]);
            }

            return [pts, flowers, babies, sparkles];
        }

        const scene = build_scene();
        let hearts = [];
        let startTime = performance.now();

        function updateHearts(hearts, dt) {
            while (hearts.length < NUM_HEARTS) {
                hearts.push([rnd(), 1.0 + rnd(), 0.03 + rnd()*0.05, rnd() * 6.28, HEART_COLORS[Math.floor(rnd()*HEART_COLORS.length)]]);
            }
            hearts.forEach(h => {
                h[1] -= h[2] * dt;
                if (h[1] < 0) {
                    h[0] = rnd();
                    h[1] = 1.0;
                    h[4] = HEART_COLORS[Math.floor(rnd()*HEART_COLORS.length)];
                }
            });
        }

        function ansiToHex(code) {
            if (code === 231 || code === 255) return '#fff';
            if (code >= 220 && code <= 230) return '#ffe600';
            if (code >= 38 && code <= 51 || code >= 116 && code <= 123) return '#38bdf8';
            if (code >= 25 && code <= 33) return '#0284c7';
            if (code >= 17 && code <= 21) return '#0369a1';
            if (code >= 22 && code <= 114) return '#22c55e';
            if (code >= 101 && code <= 231) return '#cbd5e1';
            return '#38bdf8';
        }

        const rawMessage = "feliz 3 meses! te amo gatinha";
        const mainMsgEl = document.getElementById("main-msg");

        function render() {
            let now = (performance.now() - startTime) / 1000;
            let dt = 1 / FPS;

            // Anima o brilho amarelo nas letras da mensagem principal
            let shift = Math.floor(now * 6);
            let msgHtml = "";
            for (let i = 0; i < rawMessage.length; i++) {
                let col = MSG_HEX_COLORS[(i + shift) % MSG_HEX_COLORS.length];
                msgHtml += `<span style="color:${col}">${rawMessage[i]}</span>`;
            }
            mainMsgEl.innerHTML = msgHtml;

            let cols = 64;
            let rows = 36;

            let chars = Array.from({length: rows}, () => Array(cols).fill(' '));
            let colors = Array.from({length: rows}, () => Array(cols).fill(0));
            let zbuf = Array.from({length: rows}, () => Array(cols).fill(-1e9));

            let scale = Math.max(1.0, Math.min((rows - 2) / 1.45, (cols - 2) / 2.7));
            let sx_scale = scale * 2.0;
            let cx = cols / 2;
            let cy = 1 + 0.78 * scale;

            let ang = now * SPIN_SPEED;
            let ca = Math.cos(ang), sa = Math.sin(ang);
            let ct = Math.cos(TILT), st = Math.sin(TILT);

            function project(x, y, z) {
                let xr = x * ca - z * sa;
                let zr = x * sa + z * ca;
                let yp = y - PIVOT_Y;
                let yt = yp * ct - zr * st;
                let zt = yp * st + zr * ct;
                let f = CAM_DIST / (CAM_DIST - zt);
                return [Math.floor(cx + xr * f * sx_scale), Math.floor(cy - yt * f * scale), zt];
            }

            function project_f(x, y, z) {
                let xr = x * ca - z * sa;
                let zr = x * sa + z * ca;
                let yp = y - PIVOT_Y;
                let yt = yp * ct - zr * st;
                let zt = yp * st + zr * ct;
                let f = CAM_DIST / (CAM_DIST - zt);
                return [cx + xr * f * sx_scale, cy - yt * f * scale, zt, f];
            }

            function plot(col, row, z, ch, color) {
                if (row >= 0 && row < rows && col >= 0 && col < cols && z > zbuf[row][col]) {
                    zbuf[row][col] = z;
                    chars[row][col] = ch;
                    colors[row][col] = color;
                }
            }

            updateHearts(hearts, dt);
            hearts.forEach(([x, y, _, phase, color]) => {
                let col = Math.floor((x + 0.015 * Math.sin(now * 1.2 + phase)) * cols) % cols;
                plot(col, Math.floor(y * rows), -50, "♥", color);
            });

            let [pts, flowers, babies, sparkles] = scene;

            pts.forEach(([x, y, z, nx, ny, nz, pal, tone, two_sided, override]) => {
                let [col, row, zt] = project(x, y, z);
                let nxr = nx * ca - nz * sa;
                let nzr = nx * sa + nz * ca;
                let nyt = ny * ct - nzr * st;
                let nzt = ny * st + nzr * ct;
                let dot = nxr * LX + nyt * LY + nzt * LZ;
                if (two_sided && dot < 0) dot = -dot * 0.55;
                let b = 0.25 + 0.75 * Math.max(0.0, dot) + tone;
                b = Math.min(0.999, Math.max(0.0, b));
                let ch = (override === "P") ? PETAL_SHADE[Math.floor(b * PETAL_SHADE.length)] : (override || SHADE[Math.floor(b * SHADE.length)]);
                plot(col, row, zt, ch, pal[Math.floor(b * pal.length)]);
            });

            flowers.forEach(([pos, kind, pal, cpal, n_pet, R, seed]) => {
                let [x, y, z] = pos;
                let [fx, fy, zt, f] = project_f(x, y, z);
                let rx = R * f * sx_scale, ry = R * f * scale;
                let dim = -0.4 * (1 - Math.min(1.0, Math.max(0.0, (zt + 0.6) / 1.2)));
                let rot = seed + ang * 0.7;
                
                for (let row = Math.floor(fy - ry) - 1; row <= Math.floor(fy + ry) + 1; row++) {
                    let dy = (row + 0.5 - fy) / ry;
                    for (let col = Math.floor(fx - rx) - 1; col <= Math.floor(fx + rx) + 1; col++) {
                        let dx = (col + 0.5 - fx) / rx;
                        if (kind === "disc") {
                            let s = Math.sqrt(dx * dx + dy * dy);
                            if (s > 1.0) continue;
                            if (s < 0.3) {
                                let b = Math.min(0.999, Math.max(0.0, 0.55 - 0.35 * dx - 0.35 * dy + dim));
                                plot(col, row, zt + 0.06, s < 0.17 ? "@" : "o", cpal[Math.floor(b * cpal.length)]);
                                continue;
                            }
                            let ph = Math.atan2(dy, dx);
                            let reach = 0.32 + 0.68 * Math.pow(Math.abs(Math.cos(n_pet * (ph + rot) / 2)), 0.7);
                            if (s > reach) continue;
                            let edge = (s > reach - 0.14) ? -0.22 : 0.0;
                            let b = Math.min(0.999, Math.max(0.0, 0.62 - 0.22 * dx - 0.28 * dy + 0.12 * s + edge + dim));
                            plot(col, row, zt + 0.04 * (1 - s), PETAL_SHADE[Math.floor(b * PETAL_SHADE.length)], pal[Math.floor(b * pal.length)]);
                        } else {
                            let v = (1 - dy) / 2;
                            if (v < 0 || v > 1) continue;
                            let hw = 0.62 * Math.sin(Math.PI * 0.5 * Math.min(1.0, v * 1.5 + 0.05));
                            if (hw <= 0 || Math.abs(dx) > hw) continue;
                            let xn = dx / hw;
                            if (v > 0.72 + 0.28 * Math.pow(Math.cos(1.5 * Math.PI * xn), 2)) continue;
                            let seam = (Math.abs(Math.abs(xn) - 0.33) < 0.12 && v > 0.3) ? -0.25 : 0.0;
                            let b = Math.min(0.999, Math.max(0.0, 0.55 - 0.3 * xn + 0.1 * v + seam + dim));
                            plot(col, row, zt + 0.03, PETAL_SHADE[Math.floor(b * PETAL_SHADE.length)], pal[Math.floor(b * pal.length)]);
                        }
                    }
                }
            });

            babies.forEach(([x, y, z, phase]) => {
                let [col, row, zt] = project(x, y, z);
                let star = Math.sin(now * 2 + phase) > 0.6;
                plot(col, row, zt + 0.02, star ? "*" : "·", star ? 231 : 255);
            });

            sparkles.forEach(([x, y, z, phase, speed]) => {
                let [col, row, zt] = project(x, y, z);
                let tw = Math.sin(now * speed + phase);
                if (tw > 0.85) plot(col, row, zt, "*", 231);
                else if (tw > 0.4) plot(col, row, zt, "+", 225);
                else if (tw > 0.0) plot(col, row, zt, "·", 218);
            });

            let htmlLines = [];
            for (let r = 0; r < rows; r++) {
                let curColor = -1;
                let textBuffer = "";

                for (let c = 0; c < cols; c++) {
                    let ch = chars[r][c];
                    let colVal = colors[r][c];

                    if (colVal !== curColor) {
                        if (textBuffer.length > 0) {
                            let hex = ansiToHex(curColor);
                            let style = curColor > 0 ? `color: ${hex};` : '';
                            htmlLines.push(style ? `<span style="${style}">${textBuffer}</span>` : textBuffer);
                            textBuffer = "";
                        }
                        curColor = colVal;
                    }
                    textBuffer += (ch === ' ') ? '&nbsp;' : ch;
                }
                if (textBuffer.length > 0) {
                    let hex = ansiToHex(curColor);
                    let style = curColor > 0 ? `color: ${hex};` : '';
                    htmlLines.push(style ? `<span style="${style}">${textBuffer}</span>` : textBuffer);
                }
                htmlLines.push("<br>");
            }

            document.getElementById("terminal").innerHTML = htmlLines.join("");
        }

        setInterval(render, 1000 / FPS);
    </script>
</body>
</html>
